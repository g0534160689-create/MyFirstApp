name: Build Windows app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 app
        run: dotnet publish RavKavKiosk/RavKavKiosk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: RavKavKiosk-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
