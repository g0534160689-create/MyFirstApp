name: Build Windows app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RavKavKiosk/RavKavKiosk.csproj

      - name: Build
        run: dotnet build RavKavKiosk/RavKavKiosk.csproj --configuration Release --no-restore
