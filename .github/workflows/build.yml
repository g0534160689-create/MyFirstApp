name: Build Windows installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force webview2 | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/WebView2EvergreenStandaloneInstallerX64" -OutFile "webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

      - name: Publish self-contained Windows app
        run: dotnet publish RavKavKiosk/RavKavKiosk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Build one-file installer
        run: iscc /DMyAppVersion=1.2.${{ github.run_number }} installer/RavKavKiosk.iss

      - name: Install the actual Setup package
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "RavKavKiosk-SmokeInstall"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $setup = Join-Path $PWD "installer-output/RavKavKiosk-Setup.exe"
          Write-Host "Starting silent install: $setup"
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") -Wait -PassThru
          Write-Host "Installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "RavKavKiosk.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed EXE was not found: $installedExe" }

      - name: Smoke-test installed app and WebView2
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "RavKavKiosk-SmokeInstall"
          $installedExe = Join-Path $installDir "RavKavKiosk.exe"
          $smokeLog = Join-Path $env:LOCALAPPDATA "RavKavKiosk/Logs/RavKavKiosk.log"
          if (Test-Path $smokeLog) { Remove-Item $smokeLog -Force }
          Write-Host "Starting installed app self-test: $installedExe"
          $test = Start-Process -FilePath $installedExe -ArgumentList "--smoke-test" -Wait -PassThru
          Write-Host "Smoke-test exit code: $($test.ExitCode)"
          if (Test-Path $smokeLog) { Get-Content $smokeLog }
          if ($test.ExitCode -ne 0) { throw "Installed app smoke test failed with exit code $($test.ExitCode)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavKavKiosk-Setup-win-x64
          path: installer-output/RavKavKiosk-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.1.${{ github.run_number }}"
          gh release create $tag "installer-output/RavKavKiosk-Setup.exe" --title "RavKavKiosk Setup $tag" --notes "Single-file Windows x64 installer. Includes the self-contained app and the offline Evergreen WebView2 Runtime installer."
