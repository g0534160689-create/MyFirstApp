name: Build Windows installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force webview2 | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/WebView2EvergreenStandaloneInstallerX64" -OutFile "webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

      - name: Publish self-contained Windows app
        run: dotnet publish RavKavKiosk/RavKavKiosk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Build one-file installer
        run: iscc installer/RavKavKiosk.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavKavKiosk-Setup-win-x64
          path: installer-output/RavKavKiosk-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.1.${{ github.run_number }}"
          gh release create $tag "installer-output/RavKavKiosk-Setup.exe" --title "RavKavKiosk Setup $tag" --notes "Single-file Windows x64 installer. Includes the self-contained app and the offline Evergreen WebView2 Runtime installer."
